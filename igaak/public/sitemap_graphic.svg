<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="background:#0a0a14;">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9370DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B0082;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Main Title -->
  <text x="600" y="60" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="bold" fill="white" filter="url(#glow)">IGAAK Website Sitemap</text>
  <text x="600" y="85" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#888">High-End Architecture Overview</text>

  <!-- ROOT Node -->
  <g transform="translate(500, 120)">
    <rect x="0" y="0" width="200" height="60" rx="10" fill="#1a1a2e" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)" />
    <text x="100" y="35" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#FFD700">IGAAK (Root)</text>
    <text x="100" y="48" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#CCC">layout.tsx</text>
  </g>

  <!-- Main Layout Group -->
  <g transform="translate(500, 220)">
    <rect x="-20" y="0" width="240" height="50" rx="8" fill="#16213e" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="100" y="30" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#FFF">📦 (main) Layout Group</text>
    <text x="100" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#AAA">Includes Header &amp; Footer</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="180" x2="600" y2="220" stroke="#FFD700" stroke-width="2" />
  <line x1="600" y1="270" x2="600" y2="320" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  
  <!-- Branch Horizontal Line -->
  <line x1="250" y1="320" x2="950" y2="320" stroke="rgba(255,255,255,0.3)" stroke-width="2" />

  <!-- Page Nodes -->
  
  <!-- HOME -->
  <g transform="translate(150, 350)">
    <line x1="100" y1="-30" x2="100" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
    <rect x="0" y="0" width="200" height="180" rx="12" fill="#0f3460" stroke="#FFD700" stroke-width="2" />
    <text x="100" y="30" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" fill="#FFF">🏠 Home /</text>
    
    <!-- Sections -->
    <rect x="15" y="50" width="170" height="30" rx="4" fill="rgba(255,255,255,0.1)" />
    <text x="25" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#EEE">Hero Banner (+CTA)</text>
    
    <rect x="15" y="90" width="170" height="30" rx="4" fill="rgba(255,255,255,0.1)" />
    <text x="25" y="110" font-family="'Inter', sans-serif" font-size="12" fill="#EEE">Featured Artists (Grid)</text>
    
    <rect x="15" y="130" width="170" height="30" rx="4" fill="rgba(255,255,255,0.1)" />
    <text x="25" y="150" font-family="'Inter', sans-serif" font-size="12" fill="#EEE">About Section</text>
  </g>

  <!-- ROSTER -->
  <g transform="translate(400, 350)">
    <line x1="100" y1="-30" x2="100" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
    <rect x="0" y="0" width="200" height="140" rx="12" fill="#0f3460" stroke="#9370DB" stroke-width="2" />
    <text x="100" y="30" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" fill="#FFF">👥 Roster</text>
    
    <rect x="15" y="50" width="170" height="30" rx="4" fill="rgba(255,255,255,0.1)" />
    <text x="25" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#EEE">Full Artist Grid</text>

    <rect x="15" y="90" width="170" height="30" rx="4" fill="rgba(255,255,255,0.1)" />
    <text x="25" y="110" font-family="'Inter', sans-serif" font-size="12" fill="#EEE">Filter / Search UI</text>
    
    <!-- Connector to Child -->
    <line x1="100" y1="140" x2="100" y2="180" stroke="#9370DB" stroke-width="2" stroke-dasharray="5,5" />
    
    <!-- DJ DETAIL Sub-node -->
    <g transform="translate(20, 180)">
        <rect x="0" y="0" width="160" height="120" rx="8" fill="#1a1a2e" stroke="#9370DB" stroke-width="1" />
        <text x="80" y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#9370DB">🎧 DJ Detail</text>
        <text x="20" y="50" font-family="'Inter', sans-serif" font-size="10" fill="#BBB">• Hero Profile</text>
        <text x="20" y="65" font-family="'Inter', sans-serif" font-size="10" fill="#BBB">• Bio Text</text>
        <text x="20" y="80" font-family="'Inter', sans-serif" font-size="10" fill="#BBB">• Social Links</text>
        <text x="20" y="95" font-family="'Inter', sans-serif" font-size="10" fill="#BBB">• Music / Events</text>
    </g>
  </g>

  <!-- CONTACT -->
  <g transform="translate(850, 350)">
    <line x1="100" y1="-30" x2="100" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
    <rect x="0" y="0" width="200" height="140" rx="12" fill="#0f3460" stroke="#00BFFF" stroke-width="2" />
    <text x="100" y="30" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" fill="#FFF">📧 Contact</text>
    
    <rect x="15" y="50" width="170" height="30" rx="4" fill="rgba(255,255,255,0.1)" />
    <text x="25" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#EEE">Inquiry Form</text>
    
    <rect x="15" y="90" width="170" height="30" rx="4" fill="rgba(255,255,255,0.1)" />
    <text x="25" y="110" font-family="'Inter', sans-serif" font-size="12" fill="#EEE">Location Map</text>
  </g>

  <!-- Footer -->
  <text x="600" y="780" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#555">Generated by Antigravity · IGAAK Project 2026</text>
</svg>
